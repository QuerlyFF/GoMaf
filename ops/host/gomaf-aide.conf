database_in=file:/var/lib/aide/gomaf-aide.db
database_out=file:/var/lib/aide/gomaf-aide.db.new
database_new=file:/var/lib/aide/gomaf-aide.db.new
report_url=stdout
log_level=warning
GOMAF = p+i+n+u+g+s+m+c+sha256

/etc/ssh GOMAF
/etc/sudoers$ GOMAF
/etc/sudoers.d GOMAF
/etc/pam.d GOMAF
/etc/systemd/system GOMAF
/etc/ufw GOMAF
/etc/sysctl.d GOMAF
/etc/fstab$ GOMAF
/etc/modules$ GOMAF
/etc/docker GOMAF
/etc/fail2ban GOMAF
/etc/audit GOMAF
/etc/aide GOMAF
/etc/gomaf GOMAF
/etc/gomaf-owner-mcp GOMAF
/root/.ssh GOMAF
/home/opsadmin/.ssh GOMAF
/usr/local/sbin/gomaf-.* GOMAF
/opt/gomaf-owner-mcp GOMAF
/opt/remote-desktop-commander/package.json$ GOMAF
/opt/remote-desktop-commander/package-lock.json$ GOMAF
/opt/remote-desktop-commander/node_modules/@wonderwhy-er/desktop-commander/dist GOMAF
/srv/gomaf/compose.prod.yaml$ GOMAF
/srv/gomaf/caddy GOMAF
# Candidate source under /srv/gomaf/ops is intentionally mutable before deploy.
# Its integrity is bound by source-hash/internal manifests/PREDEPLOY rather than
# by the host AIDE baseline, which must remain stable between deployments.
/srv/gomaf/.deploy/active_release$ GOMAF
/srv/gomaf/.deploy/current_image$ GOMAF
/srv/gomaf/.deploy/current_source_hash$ GOMAF
/var/lib/docker/volumes/gomaf_postgres_data/_data/pg_hba.conf$ GOMAF
/var/lib/docker/volumes/gomaf_postgres_data/_data/postgresql.conf$ GOMAF
