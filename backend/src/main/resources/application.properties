spring.application.name=classic-mafia

server.address=0.0.0.0
server.port=${SERVER_PORT:8787}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:NONE}
server.tomcat.redirect-context-root=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.timeout=12h
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.servlet.session.cookie.name=MAFIASESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-parameter-count=128
server.tomcat.max-part-count=4
server.tomcat.max-part-header-size=512B

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mafia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mafia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1800000


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=0B

app.mode=${APP_MODE:runtime}
app.environment=${APP_ENV:local}
app.public-base-url=${APP_PUBLIC_BASE_URL:https://gomaf.online}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:test}
app.security.ip-hash-secret=${APP_SECURITY_IP_HASH_SECRET:}
app.security.trust-proxy-headers=${APP_TRUST_PROXY_HEADERS:false}

app.log.dir=${APP_LOG_DIR:/tmp/gomaf-logs}

# v11 production SPA cutover switch; legacy MVC remains the default for tests/rollback-compatible source.
