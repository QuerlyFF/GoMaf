spring.datasource.url=jdbc:h2:mem:e2edb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
server.address=127.0.0.1
server.port=8787
server.servlet.session.cookie.name=MAFIASESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
app.environment=e2e
app.admin.username=
app.admin.password=
app.security.ip-hash-secret=e2e-secret-0123456789-abcdefghijklmnopqrstuvwxyz
app.security.trust-proxy-headers=false
app.spa.index-resource=classpath:/static/index.html

